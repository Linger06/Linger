# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build, Test, and Publish

on:
  push:
    branches: [ "master", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          11.0.100-rc.1.26425.128
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build Linger.slnx --configuration Release --no-restore
    - name: Test
      run: dotnet test Linger.slnx --configuration Release --no-build --no-restore --verbosity normal

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          11.0.100-rc.1.26425.128
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build packages
      run: |
        dotnet build Linger.slnx --configuration Release --no-restore
        dotnet pack Linger.slnx --configuration Release --no-build --no-restore --output ./nupkg
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY))
        {
          throw "NuGet Trusted Publishing did not return an API key. Check the NuGet.org trusted publishing policy and NUGET_USER."
        }

        dotnet nuget push nupkg\*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        gh release view $env:RELEASE_TAG *> $null
        if ($LASTEXITCODE -eq 0)
        {
          Write-Host "GitHub Release $env:RELEASE_TAG already exists."
          exit 0
        }

        gh release create $env:RELEASE_TAG --verify-tag --generate-notes --title $env:RELEASE_TAG
